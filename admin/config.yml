backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  # ==========================================
  # 1. HOMEPAGE & GLOBAL SETTINGS
  # ==========================================
  - name: "settings"
    label: "Site & Homepage Settings"
    delete: false
    editor:
      preview: false
    files:
      - name: "homepage"
        label: "Homepage Content"
        file: "content/settings/homepage.json"
        fields:
          - label: "Hero Title"
            name: "hero_title"
            widget: "string"
            default: "7 QUESTIONS"
          - label: "Hero Subtitle"
            name: "hero_subtitle"
            widget: "string"
            default: "JUST ENOUGH"
          - label: "Research Dropdown Points"
            name: "research_points"
            widget: "list"
            summary: "{{fields.point}}"
            field: { label: "Research Bullet Point", name: "point", widget: "string" }

          - label: "Category Card Popups (! Tooltip)"
            name: "category_descriptions"
            widget: "object"
            fields:
              - { label: "Faith Description", name: "faith_info", widget: "string", default: "Content and questions related to work with GOD" }
              - { label: "IT & Cybersecurity Description", name: "cyber_info", widget: "string", default: "Content related to IT, networking, and digital defense" }
              - { label: "Episodes & Interviews Description", name: "interviews_info", widget: "string", default: "Insights from our guest speakers and interviews" }
              - { label: "Others Description", name: "others_info", widget: "string", default: "Miscellaneous topics, finance, and general wisdom" }

          - label: "Social Media Links"
            name: "social_links"
            widget: "object"
            fields:
              - { label: "LinkedIn URL", name: "linkedin_url", widget: "string", default: "https://linkedin.com" }
              - { label: "Instagram URL", name: "instagram_url", widget: "string", default: "https://instagram.com" }

  # ==========================================
  # 2. BLOG POSTS (7-Questions Format)
  # ==========================================
  - name: "posts"
    label: "Blog Posts"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Faith", value: "faith" }
          - { label: "IT & Cybersecurity", value: "cybersecurity" }
          - { label: "Episodes & Interviews", value: "interviews" }
          - { label: "Others", value: "others" }

      - label: "Publish Date and Time"
        name: "date"
        widget: "datetime"
        date_format: "MMMM D, YYYY"
        time_format: "hh:mm A"
        format: "YYYY-MM-DDTHH:mm:ssZ"

      - label: "Subtitle / Summary"
        name: "subtitle"
        widget: "string"

      - label: "Estimated Read Time"
        name: "read_time"
        widget: "string"
        default: "4 min read"

      - label: "Introduction Text"
        name: "intro"
        widget: "markdown"

      - label: "The 7 Questions"
        name: "questions"
        widget: "list"
        summary: "Q{{index}}: {{fields.question}}"
        min: 1
        max: 7
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Answer / Explanation", name: "answer", widget: "markdown" }

      - label: "Conclusion / Closing Thoughts"
        name: "conclusion"
        widget: "markdown"
        required: false
